<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reversi</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Reversi</h1>
    </header>

    <main>
        <section>
            <div class="game">
                <div class="player">
                    <span>Black</span>
                    <span id=""black-count>2</span>
                </div>

                <div class="turn">
                    <span>Turn:</span>
                    <span id="current-player">Black</span>
                </div>

                <div class="player">
                    <span>White</span>
                    <span id=""black-count>2</span>
                </div>
            </div>

            <div id="board" class="board">
                <!-- Board cells will be generated by JavaScript-->
            </div>

            <div class="game-controls">
                <button id="pass-button" type="button">Pass</button>
                <button id="pass-button" type="button">Restart</button>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
